version: 1.0.0

# Northflank Infrastructure as Code (IaC) Configuration
# This file defines the entire Naija Agent Core architecture for 1-click deployment.

parameters:
  - name: REDIS_PASSWORD
    description: "Password for the Redis database"
    type: string
    generate: true
    length: 32

resources:
  # 1. Managed Redis Database (Flat monthly/free, no per-command billing)
  - name: naija-agent-redis
    type: addon
    addonType: redis
    version: "7"
    replicas: 1
    storage: 1024 # 1GB
    secrets:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

services:
  # 2. API Gateway (Public Web Service)
  - name: naija-agent-api
    type: combined
    deployment:
      instances: 1
    ports:
      - name: http
        port: 3000
        protocol: http
        public: true
    build:
      dockerfile:
        path: /Dockerfile
    startup:
      command: npm start
      workingDir: /apps/api
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${naija-agent-redis.endpoints.default.host}:${naija-agent-redis.endpoints.default.port}"
      NODE_ENV: "production"
      # Add other API environment variables here (PORT, etc.)
    dependsOn:
      - naija-agent-redis

  # 3. Zynux Worker (Background Job Processor for Business)
  - name: naija-agent-worker
    type: job
    jobType: daemon
    deployment:
      instances: 1
    build:
      dockerfile:
        path: /Dockerfile
    startup:
      command: npm start
      workingDir: /apps/worker
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${naija-agent-redis.endpoints.default.host}:${naija-agent-redis.endpoints.default.port}"
      NODE_ENV: "production"
      # Add Gemini API keys and Firebase credentials here
    dependsOn:
      - naija-agent-redis

  # 4. Aelixxr Worker (Background Job Processor for Life OS)
  - name: naija-agent-worker-life
    type: job
    jobType: daemon
    deployment:
      instances: 1
    build:
      dockerfile:
        path: /Dockerfile
    startup:
      command: npm start
      workingDir: /apps/worker-life
    environment:
      REDIS_URL_LOS: "redis://:${REDIS_PASSWORD}@${naija-agent-redis.endpoints.default.host}:${naija-agent-redis.endpoints.default.port}"
      NODE_ENV: "production"
      # Add Gemini API keys and Firebase credentials here
    dependsOn:
      - naija-agent-redis

# Note: Cron jobs (like /cron/life-heartbeat) can be scheduled natively in the Northflank UI 
# to hit the public 'naija-agent-api' endpoints.