version: '3.8'

services:
  # --- 1. Gateway: Sovereign WhatsApp (Go) ---
  sidecar:
    build: .
    command: /app/apps/whatsapp-sidecar/sidecar-binary
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  # --- 2. API: Webhook & Dashboard Gateway (Node) ---
  api:
    build: .
    command: npm run start:api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  # --- 3. Logic: Zynux Business Worker (Node) ---
  worker-biz:
    build: .
    command: node apps/worker/dist/index.js
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - AI_PROVIDER_PRIMARY=${AI_PROVIDER_PRIMARY}
    depends_on:
      - redis

  # --- 4. Logic: Aelixxr Life + Hermes Body (Node/Python) ---
  worker-life:
    build: .
    command: node apps/worker-life/dist/index.js
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - WHATSAPP_SIDECAR_URL=http://sidecar:8080
    depends_on:
      - redis

  # --- 5. Data: Financial Ledger (Postgres) ---
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=naija_admin
      - POSTGRES_PASSWORD=sovereign_pass
      - POSTGRES_DB=naija_ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- 6. Memory: Task Broker (Redis) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
