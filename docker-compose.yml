version: '3.8'

services:
  # --- THE SOVEREIGN EMPIRE (Unified App Bundle) ---
  # Consolidates Sidecar, API, and Workers into one container for 
  # maximum resource efficiency (Zero Latency + Shared Memory).
  app:
    build: .
    command: /app/scripts/sovereign-start.sh
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://naija_admin:sovereign_pass@postgres:5432/naija_ledger}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - AI_PROVIDER_PRIMARY=${AI_PROVIDER_PRIMARY:-gemini}
      - AI_PROVIDER_FALLBACK=${AI_PROVIDER_FALLBACK:-gemini}
    ports:
      - "3000:3000" # API Gateway
      - "8080:8080" # WhatsApp Sidecar
    depends_on:
      - postgres
      - redis
    restart: always

  # --- Data: Financial Ledger (Postgres) ---
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=naija_admin
      - POSTGRES_PASSWORD=sovereign_pass
      - POSTGRES_DB=naija_ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # --- Memory: Task Broker (Redis) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata:
